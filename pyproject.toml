[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ratiss-biolab"
version = "1.0.0"
description = "Laboratoire biochimique low-cost souverain (incubateur, PCR, spectrophotomètre) — Priorité 2 RATISS"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Jonathan Evina", email = "samajonathan9@gmail.com"},
    {name = "JOHNKING0"},
]
keywords = ["biolab", "low-cost", "PCR", "incubateur", "spectrophotométrie", "Cameroun"]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
figures = ["matplotlib>=3.7"]
test = ["pytest>=7.0", "matplotlib>=3.7"]

[project.urls]
Homepage = "https://github.com/samajonathan9-source/ratiss-biolab"
Repository = "https://github.com/samajonathan9-source/ratiss-biolab"

[tool.setuptools.packages.find]
include = ["ratiss_biolab*"]
